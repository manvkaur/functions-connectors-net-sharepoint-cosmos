    </marker>
    <linearGradient id="database" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#50b5ee"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #243746; }
      .heading { font-size: 25px; font-weight: 600; }
      .label { font-size: 18px; font-weight: 600; }
      .detail { font-size: 14px; }
      .note { font-size: 13px; fill: #526879; }
      .node { fill: #fff; stroke: #b7cbd8; stroke-width: 1.5; }
      .flow { fill: none; stroke: #406782; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
