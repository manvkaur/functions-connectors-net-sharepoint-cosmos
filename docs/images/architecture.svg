<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">SharePoint file intake through Connector Namespace Poll delivery into private Cosmos DB</title>
  <desc id="desc">SharePoint file metadata is queued in a public Connector Namespace. A VNet-integrated Azure Function authenticates with managed identity and pulls events outbound, then writes documents to Cosmos DB over a private endpoint. Public inbound access is disabled on the Function and Cosmos DB. Identity-protected host and deployment storage remains public.</desc>
